# VERIFICATION STATUS (updated Day 6): this file is validated in CI by
# `docker compose config` (syntax, interpolation and schema) and is now also
# BOUGHT AND EXERCISED by the `compose-smoke-test` job, which runs
# `docker compose up -d --build --wait` and then drives real requests through
# the running container via scripts/compose_smoke_test.sh.
#
# Confirmed passing on commit 4cda54b (run 36611637287, 2026-09-29). What that
# run actually observed, not inferred:
#   * the container reached Docker's own `healthy` state, so the python/urllib
#     healthcheck below passes for real -- it exists because this image
#     installs no apt packages at all and has no curl/wget/nc to probe with;
#   * the three models/ artifacts are present and non-empty INSIDE the running
#     container, and /risk/predict returned a real class ("High") with five
#     SHAP factor contributions, so joblib deserialization and the explanation
#     step work in the image and not merely on a dev machine;
#   * model_test_accuracy came back as exactly 80.0, matching
#     models/metrics.json -- the check that matters, because
#     utils/risk.py:load_model_metrics() swallows every read error and returns
#     None, so a missing artifact would have degraded silently instead of
#     failing;
#   * /loan/calculate and /loan/prepayment return real maths (paying an extra
#     5000/month cut a 60-month term to 38, saving 22 months);
#   * register -> login -> save scenario -> list -> delete all work, and the
#     sqlite DB lands at /app/data/app.db inside the repaymaster_data volume
#     rather than a container-local path `compose down` would delete with every
#     registered user.
#
# The earlier caveat here -- "no Docker daemon existed where this was written,
# so nothing has ever started these containers" -- was accurate for the whole
# life of the project up to that run, and is what the job was added to retire.
#
# `scripts/check_images.py` (also in CI) separately confirms every referenced
# base image still exists in its registry -- the check that would have caught
# the sibling CertiFake project's stack being broken for 17 days by MinIO
# deleting its images from Docker Hub on 2026-09-11.
#
# Stack (Day 3-4 operations work):
#   postgres  the ledger, payments, webhook inbox and reconciliation database.
#   migrate   one-shot: applies the Alembic migrations, then exits. api and worker wait for it.
#   api       FastAPI. Accepts signed webhooks into the inbox and serves loans and operations.
#   worker    drains the webhook inbox (python -m app.worker). Run as many replicas as needed:
#             claims use row locks, so an event is applied once.
# Users and saved scenarios stay in sqlite under the repaymaster_data volume (utils/auth.py).
# The in-process rate limiter is per replica, so scale api horizontally only behind a shared limiter.
services:
  postgres:
    image: postgres:17
    container_name: repaymaster_postgres
    environment:
      POSTGRES_DB: repaymaster
      POSTGRES_USER: rm
      # Required: the stack refuses to start without a password. See backend/.env.example.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a .env file -- see backend/.env.example}
    volumes:
      - repaymaster_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rm -d repaymaster"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build: .
    container_name: repaymaster_migrate
    # `python -m` puts the working directory on sys.path, so `app` imports inside env.py.
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment: &app-env
      APP_ENV: development
      DEBUG: "true"
      CORS_ORIGINS: "*"
      # Required -- app/core/config.py has no fallback, so the containers fail loudly without it.
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in a .env file -- see backend/.env.example}
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      DATABASE_URL: postgresql+psycopg://rm:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a .env file}@postgres:5432/repaymaster
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    container_name: repaymaster_api
    ports:
      - "8010:8010"
    environment:
      <<: *app-env
      APP_NAME: RepayMaster API
    volumes:
      # Persists the sqlite user/scenario DB (utils/auth.py) across
      # container restarts and recreations -- without this, `docker
      # compose down` would silently delete every registered user.
      - repaymaster_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Python, not curl: the Dockerfile installs no apt packages at all on
    # python:3.12-slim-trixie, so curl/wget/nc are absent. GET /health exists
    # in backend/app/main.py and the container listens on 8010.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  worker:
    build: .
    container_name: repaymaster_worker
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *app-env
      WORKER_POLL_SECONDS: "2"
      WORKER_BATCH_SIZE: "50"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  repaymaster_data:
  repaymaster_pg:
