name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        # No pre-existing ruff config in this repo -- runs with ruff's
        # sane defaults rather than adding config for its own sake.
        # Pinned (Day-7, finding S13): this used to install whatever ruff was
        # newest, so a lint rule added upstream could turn a green build red
        # with no commit in this repo. Verified locally that 0.16.9 passes.
        run: |
          pip install -q ruff==0.16.9
          ruff check app

      - name: Security scan (pip-audit)
        # Day-7 remediation (finding S3): this step used to be
        #   pip-audit --desc || true
        # with continue-on-error, i.e. non-blocking twice over. It printed
        # "Found 36 known vulnerabilities in 3 packages" and the build still
        # reported success -- which is how vulnerable pins survived in a repo
        # that claims security work. The dependencies have since been bumped to
        # a clean set (verified locally: "No known vulnerabilities found"), so
        # this is now a real gate with zero waivers.
        #
        # If a future advisory has no available fix, do NOT re-add `|| true`.
        # Use `--ignore-vuln <ID>` with a comment saying why it is not
        # reachable from this app's code paths and the date to re-review, so
        # the waiver is visible in the workflow rather than buried in a log
        # nobody reads.
        #
        # pip is upgraded again here (the install step already did it) so this
        # step stays self-contained if reordered: pip-audit audits the whole
        # environment, and an outdated installer itself trips PYSEC-2026-3721.        #
        # pip AND setuptools are upgraded here to keep this step self-contained
        # if reordered: pip-audit audits the WHOLE environment, including build
        # tools the runner preinstalls that this repo never ships, and outdated
        # ones trip their own advisories -- PYSEC-2026-3721 for pip, and
        # PYSEC-2026-3447 for the runner's setuptools 79.0.1, which turned the
        # sibling CertiFake job red the moment its audit became blocking.
        # Upgrading is the right response; waiving is not, because `--ignore-vuln`
        # here would hide the same advisory if it ever reached a shipped image.
        # That is why the docker-build job also scans the IMAGE from the inside,
        # as built, with nothing upgraded first -- a scan that cannot be
        # satisfied by fixing the runner.
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0"
          pip install -q pip-audit
          pip-audit --desc

      - name: Run tests
        env:
          SECRET_KEY: ci-only-secret-not-used-anywhere-real
        # --cov added Day 7; see backend/requirements.txt note. term-missing
        # keeps the gaps visible in the log rather than hiding behind a total.
        run: pytest app/tests/ -v --cov=app --cov-report=term-missing

  docker-build:
    # Verifies the Dockerfile at the repo root actually builds -- this
    # project's Dockerfile could not be built or run in the sandbox this
    # was developed in (no Docker daemon available there), so this CI job
    # is the first real verification that it builds at all, not just a
    # repeat of a check already done locally.
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t repaymaster-api:ci .
      - name: Security scan of the built image (audits what actually ships)
        # WHY A SECOND SCAN, WHEN THE `test` JOB ALREADY RUNS pip-audit
        # -------------------------------------------------------------
        # That one audits the RUNNER's Python. It proves the pins resolve cleanly
        # on this interpreter, but the artifact that ships is this image, built
        # FROM python:3.12-slim-trixie, which contributes its own pip and setuptools -- neither
        # appears in requirements.txt, so no pin bump can reach them and no
        # runner-side scan can see them. Not hypothetical: the runner scan went
        # red on setuptools 79.0.1 (PYSEC-2026-3447, fix 83.0.0), a package this
        # repo never installs.
        #
        # This audits the image AS BUILT. pip-audit is installed at runtime so it
        # never becomes a layer of the shipped image, and nothing is upgraded
        # before the scan: if the base layer carries a vulnerable build tool the
        # job must go red, so the fix lands in the Dockerfile -- where it changes
        # what ships -- instead of in a command that only changes what the
        # scanner happens to see.
        run: |
          docker run --rm --entrypoint sh repaymaster-api:ci -c '
            set -e
            pip install --quiet --no-cache-dir pip-audit
            echo "--- build tools the base image contributed ---"
            pip freeze | grep -iE "^(pip|setuptools|wheel)==" || echo "(none reported)"
            pip-audit --desc
          '

  # ===========================================================================
  # Boots docker-compose.yml for real and drives requests through the running
  # container.
  #
  # WHY BUILDING IS NOT ENOUGH HERE
  # --------------------------------
  # This project's headline feature is an ML endpoint backed by joblib
  # artifacts in models/. utils/risk.py loads them LAZILY behind
  # functools.lru_cache, so nothing touches those files at import time or at
  # build time: a container whose artifacts are missing, truncated, or
  # unreadable by the image's own scikit-learn builds perfectly, passes
  # `docker build`, and then returns 503 on the first /risk/predict. The
  # docker-build job above therefore cannot vouch for the feature this repo
  # exists for, and the pytest suite runs against the runner's Python and the
  # runner's copy of the repo -- not the image.
  #
  # Both docker-compose.yml and Dockerfile carried an explicit note that
  # runtime was unverified ("nothing has ever started these containers,
  # confirmed the healthcheck passes, or driven a request through the app").
  # That was accurate when written. This job is what retires it.
  #
  # Also verified here, for the first time: that the python/urllib healthcheck
  # actually passes (this image installs no apt packages, so it has no
  # curl/wget/nc to probe with), and that utils/auth.py's sqlite DB really
  # lands in the repaymaster_data volume at /app/data/app.db rather than in a
  # container-local path that `compose down` would delete along with every
  # registered user.
  #
  # Assertions live in scripts/compose_smoke_test.sh.
  # ===========================================================================
  compose-smoke-test:
    runs-on: ubuntu-latest
    needs: docker-build
    timeout-minutes: 20

    env:
      # compose requires this to interpolate (`${SECRET_KEY:?...}`);
      # app/core/config.py has no fallback, so the container fails loudly
      # without it. Throwaway value -- not a real credential.
      SECRET_KEY: ci-smoke-only-not-a-real-secret-value

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --wait blocks until the healthcheck reports healthy, so this step is
      # itself the empirical confirmation that the healthcheck works.
      - name: Boot the stack and wait for the healthcheck
        run: |
          docker compose version
          docker compose up -d --build --wait --wait-timeout 600

      - name: Report container state
        if: always()
        run: docker compose ps -a

      - name: Run the compose smoke test
        run: bash scripts/compose_smoke_test.sh

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --tail 150

      - name: Tear down (volumes too, so no user/scenario rows leak between runs)
        if: always()
        run: docker compose down -v --remove-orphans --timeout 30

  config-validation:
    # Deployment-config checks, added Day 5. Motivation is concrete: the
    # sibling CertiFake project's compose stack sat broken for 17 days
    # because MinIO deleted `minio/minio` from Docker Hub on 2026-09-11 and
    # nothing checked -- `docker-compose config` validates SYNTAX, not
    # whether an image still exists, and no Docker daemon was available
    # where any of this was developed.
    #
    # Neither check below needs a Docker daemon.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML (for the consistency checker)
        run: python -m pip install -q pyyaml

      - name: Validate docker-compose.yml
        # SECRET_KEY is required for interpolation (the compose file uses
        # `${SECRET_KEY:?...}` so the app fails loudly without it); the value
        # is irrelevant here because nothing is started, only parsed.
        env:
          SECRET_KEY: ci-validation-only-not-a-real-secret
        run: |
          docker compose version
          docker compose config --quiet
          echo "compose config: valid"

      - name: Check every referenced image still exists in its registry
        # Resolves compose `image:` refs AND Dockerfile `FROM` lines --
        # including the pinned python:3.12-slim-trixie base, which is the
        # exact thing that silently broke CertiFake's build on Day 3 when an
        # unpinned `-slim` tag moved Debian releases underneath it.
        run: python3 scripts/check_images.py docker-compose.yml Dockerfile

      - name: Cross-file consistency
        run: python3 scripts/check_config_consistency.py
