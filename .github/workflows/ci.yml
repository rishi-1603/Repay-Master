name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        # No pre-existing ruff config in this repo -- runs with ruff's
        # sane defaults rather than adding config for its own sake.
        run: |
          pip install -q ruff
          ruff check app

      - name: Security scan (pip-audit)
        # continue-on-error: surfaces known-vulnerable dependency pins for
        # a human to triage, doesn't block every push on a transitive CVE
        # that may not be reachable from this app's code paths.
        run: |
          pip install -q pip-audit
          pip-audit --desc || true
        continue-on-error: true

      - name: Run tests
        env:
          SECRET_KEY: ci-only-secret-not-used-anywhere-real
        run: pytest app/tests/ -v

  docker-build:
    # Verifies the Dockerfile at the repo root actually builds -- this
    # project's Dockerfile could not be built or run in the sandbox this
    # was developed in (no Docker daemon available there), so this CI job
    # is the first real verification that it builds at all, not just a
    # repeat of a check already done locally.
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t repaymaster-api:ci .

  config-validation:
    # Deployment-config checks, added Day 5. Motivation is concrete: the
    # sibling CertiFake project's compose stack sat broken for 17 days
    # because MinIO deleted `minio/minio` from Docker Hub on 2026-09-11 and
    # nothing checked -- `docker-compose config` validates SYNTAX, not
    # whether an image still exists, and no Docker daemon was available
    # where any of this was developed.
    #
    # Neither check below needs a Docker daemon.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML (for the consistency checker)
        run: python -m pip install -q pyyaml

      - name: Validate docker-compose.yml
        # SECRET_KEY is required for interpolation (the compose file uses
        # `${SECRET_KEY:?...}` so the app fails loudly without it); the value
        # is irrelevant here because nothing is started, only parsed.
        env:
          SECRET_KEY: ci-validation-only-not-a-real-secret
        run: |
          docker compose version
          docker compose config --quiet
          echo "compose config: valid"

      - name: Check every referenced image still exists in its registry
        # Resolves compose `image:` refs AND Dockerfile `FROM` lines --
        # including the pinned python:3.12-slim-trixie base, which is the
        # exact thing that silently broke CertiFake's build on Day 3 when an
        # unpinned `-slim` tag moved Debian releases underneath it.
        run: python3 scripts/check_images.py docker-compose.yml Dockerfile

      - name: Cross-file consistency
        run: python3 scripts/check_config_consistency.py
